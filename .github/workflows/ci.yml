name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: Laravel (Pint, Larastan, tests on PostgreSQL)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: stocksense_test
          POSTGRES_USER: stocksense
          POSTGRES_PASSWORD: secret
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U stocksense -d stocksense_test"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_USERNAME: stocksense
      DB_PASSWORD: secret
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, gd, zip, bcmath, pcntl, exif
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: composer lint:check      # Pint
      - run: composer types:check     # Larastan (level 7)
      - run: php artisan test

  frontend:
    name: React (Vite+ check, tsc, build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      # Wayfinder generates the TypeScript route helpers from Laravel's routes.
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          extensions: pdo_pgsql, redis, intl, bcmath
          tools: composer:v2
          coverage: none
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: cp .env.example .env && php artisan key:generate
      - run: php artisan wayfinder:generate --with-form
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run check          # oxlint + oxfmt via Vite+
      - run: npm run types:check    # tsc --noEmit
      - run: npm test               # Vitest component tests
      - run: npm run build

  ml:
    name: ML service (ruff + mypy + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ml
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv python install 3.12
      - run: uv sync --group dev --frozen
      - run: uv run ruff check app tests scripts
      - run: uv run mypy app
      - run: uv run pytest -q

  docker-smoke:
    name: Docker stack boots healthy
    runs-on: ubuntu-latest
    needs: [php, frontend, ml]
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the stack
        run: env UID=$(id -u) GID=$(id -g) docker compose up -d --build --wait --wait-timeout 420
      # Sessions live in the database, so the login page needs the tables.
      - name: Run migrations and seed roles
        run: |
          docker compose exec -T app php artisan migrate --force
          docker compose exec -T app php artisan db:seed --force
      - name: Probe login page and ML service
        run: |
          curl -fsS http://localhost:8080/login -o /dev/null
          curl -fsS http://localhost:8001/health
      - name: Logs on failure
        if: failure()
        run: docker compose logs --tail 80
      - run: docker compose down -v
        if: always()

  security:
    name: Dependency audits (composer, npm, pip)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: "8.4"
          tools: composer:v2
          coverage: none
      - name: composer audit
        working-directory: web
        run: composer audit --locked --no-interaction
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: npm audit
        working-directory: web
        run: npm audit --audit-level=high
      - uses: astral-sh/setup-uv@v5
      - name: pip-audit (the locked Python dependencies)
        working-directory: ml
        run: |
          uv export --format requirements-txt --no-dev --no-hashes --no-emit-project > /tmp/requirements.txt
          uv tool run pip-audit -r /tmp/requirements.txt --disable-pip --no-deps

  docker-prod:
    name: Production images build, start through the strict check, and answer
    runs-on: ubuntu-latest
    needs: [php, frontend, ml]
    env:
      STACK: docker compose -p stocksense-ci -f compose.prod.yaml -f e2e/compose.e2e.yaml --env-file e2e/stack.env
    steps:
      - uses: actions/checkout@v4
      - name: Build and start the production stack
        run: $STACK up -d --build --wait --wait-timeout 600
      - name: The strict start-up check passed
        run: |
          logs=$($STACK logs app)
          echo "$logs" | grep -q "No failures"
          if echo "$logs" | grep -q "FAIL"; then echo "the start-up check reported a failure"; exit 1; fi
      - name: The site answers, with its security headers
        run: |
          headers=$(curl -fsSI http://localhost:8090/login)
          echo "$headers"
          echo "$headers" | grep -qi "^content-security-policy: .*script-src 'self' 'nonce-"
          echo "$headers" | grep -qi "^x-frame-options: SAMEORIGIN"
          echo "$headers" | grep -qi "^x-content-type-options: nosniff"
          curl -fsS http://localhost:8090/nginx-health
          curl -fsS http://localhost:8090/up -o /dev/null
      - name: Nothing private is served
        run: |
          for path in /.env /.git/config /composer.json /vendor/autoload.php /phpinfo.php; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "http://localhost:8090$path")
            echo "$path -> $code"
            [ "$code" = "403" ] || [ "$code" = "404" ]
          done
      - name: Only the web port is published
        run: |
          published=$(docker ps --filter "name=stocksense-ci" --format '{{.Names}} {{.Ports}}' | grep -E "(db|redis|ml)-1" | grep "0.0.0.0" || true)
          if [ -n "$published" ]; then echo "these should not publish a port:"; echo "$published"; exit 1; fi
      - name: Logs on failure
        if: failure()
        run: $STACK logs --tail 120
      - run: $STACK down -v
        if: always()

  e2e:
    name: End-to-end tests (Playwright on the production stack)
    # The slow, thorough check: run on pull requests to main (the release gate) and on demand.
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'pull_request' && github.base_ref == 'main')
    runs-on: ubuntu-latest
    needs: [php, frontend, ml]
    timeout-minutes: 45
    env:
      STACK: docker compose -p stocksense-e2e -f compose.prod.yaml -f e2e/compose.e2e.yaml --env-file e2e/stack.env
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: e2e/package-lock.json
      - name: Install Playwright and Chromium
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Build and start the production stack
        run: $STACK up -d --build --wait --wait-timeout 600
      - name: Seed the demo accounts and data
        run: |
          $STACK run --rm --no-deps --entrypoint "" -e ALLOW_DEMO_DATA=true app             sh -c "php artisan db:seed --class=DemoUsersSeeder --force && php artisan db:seed --class=DemoDataSeeder --force"
      - name: Run the tests
        working-directory: e2e
        run: npx playwright test
      - name: Keep the report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            e2e/playwright-report
            e2e/test-results
          retention-days: 14
      - name: Logs on failure
        if: failure()
        run: $STACK logs --tail 150
      - run: $STACK down -v
        if: always()
