# StockSense AI - development stack
#   docker compose up -d --build
# Host ports: web 8080, vite 5173, ml 8001, postgres 5433, mailpit 8026
name: stocksense

x-php: &php
  build:
    context: .
    dockerfile: docker/php/Dockerfile
    target: dev
    args:
      UID: ${UID:-1000}
      GID: ${GID:-1000}
  image: stocksense-php:dev
  # Laravel reads web/.env from the bind mount itself. Do NOT use env_file here:
  # process env vars are immutable to Laravel, which breaks `artisan key:generate`.
  environment:
    ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-change-me-dev-token}
  volumes:
    - ./web:/var/www/html
    - web_node_modules:/var/www/html/node_modules
    # npm's download cache survives container recreation (the registry can be slow).
    - npm_cache:/home/app/.npm
  working_dir: /var/www/html

services:
  app:
    <<: *php
    depends_on:
      db: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "php", "-r", "exit(@fsockopen('127.0.0.1', 9000) ? 0 : 1);"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 40s

  web:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./web:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/up >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10

  vite:
    <<: *php
    command: vite-dev.sh
    ports:
      - "5173:5173"
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:5173/@vite/client >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 120s

  horizon:
    <<: *php
    command: php artisan horizon
    depends_on:
      app: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "php artisan horizon:status | grep -qi running"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 40s

  scheduler:
    <<: *php
    command: php artisan schedule:work
    depends_on:
      app: { condition: service_healthy }

  ml:
    build:
      context: ./ml
    image: stocksense-ml:dev
    environment:
      ML_INTERNAL_TOKEN: ${ML_INTERNAL_TOKEN:-change-me-dev-token}
      ML_MODELS_DIR: /models
    ports:
      - "8001:8000"
    volumes:
      - ./ml/app:/srv/app
      - ./ml/tests:/srv/tests
      - ml_models:/models
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload

  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: stocksense
      POSTGRES_USER: stocksense
      POSTGRES_PASSWORD: secret
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/postgres/01-create-test-db.sql:/docker-entrypoint-initdb.d/01-create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U stocksense -d stocksense"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailpit:
    image: axllent/mailpit:latest
    ports:
      - "8026:8025"
    healthcheck:
      test: ["CMD", "/mailpit", "readyz"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  pgdata:
  ml_models:
  web_node_modules:
  npm_cache:
