# Production web server: serves the built assets itself and hands PHP to the app container.
# TLS is not done here: put a reverse proxy (or load balancer) that terminates HTTPS in front,
# and set APP_URL=https://... and TRUSTED_PROXIES for the app (see docs/deployment.md).

server_tokens off;

# Docker's DNS. The app container is replaced on every deploy and gets a new address each time,
# so nginx must look it up again instead of remembering the one it found at start-up (which
# would answer 502 until nginx itself is restarted).
resolver 127.0.0.11 valid=10s ipv6=off;

# A second, coarser limit on signing in, in front of the per-address one in the application: the
# application allows five tries a minute for each email address, which does nothing against one
# visitor trying a few passwords on each of many accounts. This limits submissions from one IP
# address, whatever the account. Only submitting the form counts; opening the page does not.
map $request_method $login_attempt_key {
    default "";
    POST $binary_remote_addr;
}
limit_req_zone $login_attempt_key zone=login:10m rate=30r/m;
limit_req_status 429;

gzip on;
gzip_comp_level 5;
gzip_min_length 1024;
gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

server {
    listen 80;
    server_name _;
    root /var/www/html/public;
    index index.php;
    client_max_body_size 32M;

    # Built assets have a hash in their name, so they never change under the same name.
    location /build/ {
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options "nosniff";
        try_files $uri =404;
    }

    location = /login {
        limit_req zone=login burst=30 nodelay;
        try_files $uri /index.php?$query_string;
    }

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Only the front controller runs PHP. Any other .php file that ever reached the public
    # directory is a 404, not code to execute.
    location = /index.php {
        set $app_upstream app:9000;
        fastcgi_pass $app_upstream;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $realpath_root$fastcgi_script_name;
        fastcgi_read_timeout 120s;
        fastcgi_buffers 16 16k;
        fastcgi_buffer_size 32k;
    }

    location ~ \.php$ {
        return 404;
    }

    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Is this web server itself up? Independent of the application, so redeploying the app
    # does not make the web server look sick while it starts.
    location = /nginx-health {
        access_log off;
        default_type text/plain;
        return 200 "ok";
    }

    # The application's own health check.
    location = /up {
        access_log off;
        try_files $uri /index.php?$query_string;
    }
}
