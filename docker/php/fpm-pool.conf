; Pool settings for the production image.
[www]
; The application is configured through environment variables set on the container, so PHP
; must be allowed to see them (the default wipes the environment of every worker).
clear_env = no

pm = dynamic
pm.max_children = 20
pm.start_servers = 4
pm.min_spare_servers = 2
pm.max_spare_servers = 6
pm.max_requests = 500

; A request that runs this long is taken to be stuck (imports and forecasts run on the queue,
; not here).
request_terminate_timeout = 120s
