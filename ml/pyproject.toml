[project]
name = "stocksense-ml"
version = "0.1.0"
description = "Internal forecasting service for StockSense AI"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "pandas>=2.2",
    "numpy>=2.0",
    "scikit-learn>=1.5",
    "xgboost-cpu>=3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "ruff>=0.8",
    "mypy>=1.13",
    "pandas-stubs",
    "jsonschema>=4.23",
    "types-jsonschema",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# The formatter wraps code at the line length. What it leaves alone are long
# comments and docstrings, which read better as sentences than broken to fit,
# and the product table in the generator, which reads best one product per line.
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = [
    "quality: measures the model's accuracy on the synthetic shop with the real settings (slower)",
]
